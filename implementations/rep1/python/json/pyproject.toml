[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jsoncanon"
version = "1.0.0"
description = "A strict RFC 8259 JSON parser and canonical serializer, written from scratch."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
jsoncanon = "jsoncanon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
