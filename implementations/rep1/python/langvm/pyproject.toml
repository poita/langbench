[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "langvm"
version = "0.1.0"
description = "A compiler and stack virtual machine for the Vellum language"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
langvm = "langvm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
