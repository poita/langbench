[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "protowire"
version = "1.0.0"
description = "A small Protocol Buffers wire-format codec with a canonical text form"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
protowire = "protowire.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
