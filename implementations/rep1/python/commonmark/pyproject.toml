[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmarkpy"
version = "0.1.0"
description = "A dependency-free CommonMark (subset) to HTML converter modelled on cmark"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
cmarkpy = "cmarkpy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
