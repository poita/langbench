[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jtemplate"
version = "1.0.0"
description = "A small Jinja2-style template engine with a command-line tool"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
jtemplate = "jtemplate.cli:main_with_big_stack"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
