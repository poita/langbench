[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sitegen"
version = "1.0.0"
description = "A small static site generator with its own Markdown, template and TOML-subset engines."
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
sitegen = "sitegen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["src"]
addopts = "--doctest-modules"
