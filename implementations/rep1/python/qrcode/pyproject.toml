[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrcode-encoder"
version = "1.0.0"
description = "A dependency-free QR Code Model 2 encoder (ISO/IEC 18004) with a text-matrix command-line tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["qr", "qrcode", "barcode", "encoder"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
qrcode-encoder = "qrcode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
