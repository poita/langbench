[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webhooks"
version = "1.0.0"
description = "Standard Webhooks signing/verification with from-scratch SHA-256, HMAC and Base64, plus a deterministic delivery simulator"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
webhooks = "webhooks.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
