[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimedump"
version = "1.0.0"
description = "A from-scratch MIME email parser that dumps messages and attachments in a normalised text form."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["mime", "email", "rfc5322", "rfc2047", "rfc2231", "mbox"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Communications :: Email",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
mimedump = "mimedump.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
