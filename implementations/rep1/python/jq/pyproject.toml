[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jqlite"
version = "1.0.0"
description = "An interpreter for a subset of the jq filter language, with its own JSON parser and serializer"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
jqlite = "jqlite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
