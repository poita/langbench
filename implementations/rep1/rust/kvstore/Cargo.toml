[package]
name = "tessera"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Tessera: an embedded, single-file transactional document store with a write-ahead log, B+tree indexes and a small command language"
license = "MIT"
readme = "README.md"
keywords = ["database", "btree", "wal", "document-store"]
categories = ["database-implementations"]

[lib]
name = "tessera"
path = "src/lib.rs"

[[bin]]
name = "kvstore"
path = "src/main.rs"
