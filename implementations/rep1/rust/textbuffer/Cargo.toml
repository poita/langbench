[package]
name = "textbuffer"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Editing core of a text editor: line-based document, multiple cursors with selections, undo and redo"
license = "MIT"
readme = "README.md"
keywords = ["editor", "text-buffer", "cursor", "undo"]
categories = ["text-editors"]

[lib]
name = "textbuffer"
path = "src/lib.rs"

[[bin]]
name = "textbuffer-cli"
path = "src/main.rs"
