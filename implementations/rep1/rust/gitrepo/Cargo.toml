[package]
name = "gitrepo"
version = "0.1.0"
edition = "2021"
description = "A dependency-free reader for git repositories: loose objects, packfiles, refs and revision syntax"
license = "MIT"
readme = "README.md"
keywords = ["git", "packfile", "inflate", "sha1"]
categories = ["command-line-utilities", "parser-implementations"]

[lib]
name = "gitrepo"
path = "src/lib.rs"

[[bin]]
name = "gitrepo"
path = "src/main.rs"
