[package]
name = "langvm"
version = "0.1.0"
edition = "2021"
description = "A compiler and stack virtual machine for the Vellum language"
license = "MIT"
readme = "README.md"
keywords = ["compiler", "vm", "interpreter", "bytecode", "language"]
categories = ["compilers"]

[lib]
name = "langvm"
