{% extends "base.html" %}
{% block title %}{{ post.title }} · {{ site.title }}{% endblock %}
{% block body %}<article>
{{ post.content }}</article>
<p>{{ post.date_long }}{% for t in post.tags %} <a href="{{ t.url }}">{{ t.name }}</a>{% endfor %}</p>
{% if post.older %}<a href="{{ post.older.url }}">{{ post.older.title }}</a>{% endif %}{% endblock %}
