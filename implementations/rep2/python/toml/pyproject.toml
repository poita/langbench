[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tomlcodec"
version = "0.1.0"
description = "A from-scratch TOML 1.0.0 parser and canonical serializer with a tagged-JSON interchange format"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["toml", "parser", "serializer", "toml-test"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
tomlcodec = "tomlcodec.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tomlcodec = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
