[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiln-build"
version = "1.0.0"
description = "Kiln: an incremental build system with its own build language, simulated on a virtual file system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
kiln = "kiln.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
