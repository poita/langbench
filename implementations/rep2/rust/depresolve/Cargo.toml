[package]
name = "depresolve"
version = "0.1.0"
edition = "2021"
description = "Deterministic depth-first package dependency resolver with chronological backtracking"
license = "MIT"
readme = "README.md"
keywords = ["dependency", "resolver", "semver", "backtracking"]
categories = ["algorithms", "command-line-utilities"]

[lib]
name = "depresolve"
path = "src/lib.rs"

[[bin]]
name = "depresolve"
path = "src/main.rs"
