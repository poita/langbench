{% extends "layout.html" %}
{% block title %}{{ tag.name }} &middot; {{ super() }}{% endblock %}
{% block main %}
<h1>{{ tag.name }}</h1>
<p>{{ tag.post_count }} papers.</p>
<ol>
{%- for post in posts %}
<li><a href="{{ post.url }}">{{ post.title }}</a> <time>{{ post.date }}</time></li>
{%- endfor %}
</ol>
{% endblock %}
