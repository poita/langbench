# small.cfg
page-width   = 200pt
page-height  = 120pt
margin-top   = 20pt
margin-bottom = 20pt
margin-left  = 20pt
margin-right = 20pt
hyphen-patterns = minimal
hyphenate = off
h1-newpage = on
par-indent = 28pt
footnote-min-split = 1
footer-right = {page} of {pages}
figure-frame = off
heading-align = right
footer-baseline = 112pt
